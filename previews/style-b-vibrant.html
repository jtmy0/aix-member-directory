<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风格B - 年轻活力风</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --blue: #3b82f6;
            --green: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }
        .header { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f97316 100%); padding: 3rem 2rem; text-align: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .header h1 { font-size: 2.5rem; font-weight: 800; color: white; position: relative; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .header p { color: rgba(255,255,255,0.9); position: relative; margin-top: 0.5rem; }
        .stats { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; position: relative; }
        .stat { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 0.8rem 1.5rem; border-radius: 16px; color: white; }
        .stat-num { font-size: 1.5rem; font-weight: 800; display: block; }
        .stat-label { font-size: 0.8rem; opacity: 0.9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.3s; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--purple), var(--pink)); transform: scaleX(0); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(139, 92, 246, 0.15); }
        .card:hover::before { transform: scaleX(1); }
        .card-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .avatar { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--purple), var(--pink)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem; color: white; }
        .card:nth-child(3n+1) .avatar { background: linear-gradient(135deg, var(--blue), var(--purple)); }
        .card:nth-child(3n+2) .avatar { background: linear-gradient(135deg, var(--green), var(--blue)); }
        .name { font-weight: 700; font-size: 1.1rem; }
        .meta { color: var(--text-secondary); font-size: 0.85rem; }
        .doing { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.6; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag { padding: 0.35rem 0.7rem; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
        .tag:nth-child(3n+1) { background: #f3e8ff; color: #8b5cf6; }
        .tag:nth-child(3n+2) { background: #fce7f3; color: #ec4899; }
        .tag:nth-child(3n) { background: #dbeafe; color: #3b82f6; }
        .preview-label { position: fixed; top: 1rem; left: 1rem; background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; padding: 0.5rem 1rem; border-radius: 100px; font-weight: 600; z-index: 100; }
    </style>
</head>
<body>
    <span class="preview-label">风格B: 年轻活力风</span>
    <header class="header">
        <h1>🚀 AI×个人品牌收钱营</h1>
        <p>成员目录 · 快速链接同频伙伴</p>
        <div class="stats">
            <div class="stat"><span class="stat-num">48</span><span class="stat-label">已登记</span></div>
            <div class="stat"><span class="stat-num">156</span><span class="stat-label">群成员</span></div>
            <div class="stat"><span class="stat-num">6天</span><span class="stat-label">实战营</span></div>
        </div>
    </header>
    <div class="grid">
        <div class="card"><div class="card-top"><div class="avatar">采</div><div><div class="name">采石</div><div class="meta">大一 · 山东济南</div></div></div><div class="doing">大一经济独立、知识付费讲师、OPC联合创始人、单周GMV 3w+</div><div class="tags"><span class="tag">知识付费</span><span class="tag">OPC</span><span class="tag">GMV</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">赵</div><div><div class="name">赵富哲</div><div class="meta">大一 · 河北沧州</div></div></div><div class="doing">AI中转站运营、190+人私域社群、单期裂变31人</div><div class="tags"><span class="tag">私域</span><span class="tag">裂变</span><span class="tag">社群</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">陈</div><div><div class="name">陈石林</div><div class="meta">大一 · 云南昆明</div></div></div><div class="doing">首个项目变现2000+，单日拉群180人，项目销冠</div><div class="tags"><span class="tag">变现</span><span class="tag">私域</span><span class="tag">销冠</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">董</div><div><div class="name">董美婷</div><div class="meta">大一 · 江苏南京</div></div></div><div class="doing">UI交互设计+艺术疗愈，变现破五位数，二奢销售</div><div class="tags"><span class="tag">UI设计</span><span class="tag">二奢</span><span class="tag">变现</span></div></div>
    </div>
</body>
</html>
