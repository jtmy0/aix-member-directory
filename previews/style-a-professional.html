<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风格A - 专业商务风</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --card-bg: #1a1f2e;
            --card-hover: #242b3d;
            --text: #e7e9ea;
            --text-secondary: #8899a6;
            --accent: #1d9bf0;
            --accent-gradient: linear-gradient(135deg, #1d9bf0, #1da1f2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .header { background: var(--card-bg); padding: 3rem 2rem; border-bottom: 1px solid #2a2f3e; }
        .header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .header p { color: var(--text-secondary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; transition: all 0.2s; border: 1px solid transparent; }
        .card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); }
        .card-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; }
        .name { font-weight: 700; font-size: 1.1rem; }
        .meta { color: var(--text-secondary); font-size: 0.85rem; }
        .doing { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag { padding: 0.3rem 0.6rem; background: rgba(29, 155, 240, 0.1); color: var(--accent); border-radius: 100px; font-size: 0.75rem; font-weight: 500; }
        .preview-label { position: fixed; top: 1rem; left: 1rem; background: var(--accent); color: white; padding: 0.5rem 1rem; border-radius: 100px; font-weight: 600; z-index: 100; }
    </style>
</head>
<body>
    <span class="preview-label">风格A: 专业商务风</span>
    <header class="header">
        <h1>AI×个人品牌收钱营</h1>
        <p>成员目录 · 快速链接同频伙伴</p>
    </header>
    <div class="grid">
        <div class="card"><div class="card-top"><div class="avatar">采</div><div><div class="name">采石</div><div class="meta">大一 · 山东济南</div></div></div><div class="doing">大一经济独立、知识付费讲师、OPC联合创始人、单周GMV 3w+</div><div class="tags"><span class="tag">知识付费</span><span class="tag">OPC</span><span class="tag">GMV</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">赵</div><div><div class="name">赵富哲</div><div class="meta">大一 · 河北沧州</div></div></div><div class="doing">AI中转站运营、190+人私域社群、单期裂变31人</div><div class="tags"><span class="tag">私域</span><span class="tag">裂变</span><span class="tag">社群</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">陈</div><div><div class="name">陈石林</div><div class="meta">大一 · 云南昆明</div></div></div><div class="doing">首个项目变现2000+，单日拉群180人，项目销冠</div><div class="tags"><span class="tag">变现</span><span class="tag">私域</span><span class="tag">销冠</span></div></div>
        <div class="card"><div class="card-top"><div class="avatar">董</div><div><div class="name">董美婷</div><div class="meta">大一 · 江苏南京</div></div></div><div class="doing">UI交互设计+艺术疗愈，变现破五位数，二奢销售</div><div class="tags"><span class="tag">UI设计</span><span class="tag">二奢</span><span class="tag">变现</span></div></div>
    </div>
</body>
</html>
