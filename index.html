<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI×个人品牌收钱营 - 成员目录</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === ROOT VARIABLES === */
        :root {
            --bg-primary: #f0ebe3;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --accent-purple: #764ba2;
            --accent-blue: #667eea;
            --accent-mint: #a8d4c4;
            --accent-pink: #f0b4d4;
            --accent-yellow: #f0d4a0;
            --tag-bg: #f5f0ff;
            --tag-text: #764ba2;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* === HEADER === */
        .header {
            background: var(--bg-header);
            padding: clamp(2rem, 6vh, 4rem) clamp(1rem, 5vw, 3rem);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, -20px); }
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: rgba(255,255,255,0.9);
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 4vw, 3rem);
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-lg);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-item span {
            font-size: 1.3rem;
            font-weight: 800;
            display: block;
        }

        /* === SEARCH & FILTER === */
        .search-section {
            max-width: 1200px;
            margin: -2rem auto 0;
            padding: 0 clamp(1rem, 3vw, 2rem);
            position: relative;
            z-index: 10;
        }

        .search-container {
            background: white;
            border-radius: var(--radius-xl);
            padding: clamp(1rem, 3vw, 1.5rem);
            box-shadow: var(--shadow-lg);
        }

        .search-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border: 2px solid #e8e4df;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-tag {
            padding: 0.4rem 0.8rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-tag:hover {
            background: #ece5ff;
            transform: translateY(-1px);
        }

        .filter-tag.active {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
        }

        /* === MEMBERS GRID === */
        .members-section {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 clamp(1rem, 3vw, 2rem);
        }

        .members-count {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: clamp(1rem, 2vw, 1.5rem);
        }

        /* === MEMBER CARD === */
        .member-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: clamp(1.2rem, 3vw, 1.5rem);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .member-card:hover::before {
            transform: scaleX(1);
        }

        .member-card.admin::before {
            background: linear-gradient(90deg, #f0b4d4, #764ba2);
            transform: scaleX(1);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-mint), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .member-card:nth-child(3n+1) .avatar {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
        }

        .member-card:nth-child(3n+2) .avatar {
            background: linear-gradient(135deg, var(--accent-yellow), #e8a070);
        }

        .card-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            line-height: 1.3;
        }

        .card-info .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .admin-badge {
            background: linear-gradient(135deg, #f0b4d4, #764ba2);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 600;
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .card-doing {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            padding: 0.2rem 0.5rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag.city {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tag.grade {
            background: #fff3e0;
            color: #e65100;
        }

        /* === MODAL === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: white;
            border-radius: var(--radius-xl);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .modal-info h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }

        .modal-info .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .modal-section {
            margin-bottom: 1.5rem;
        }

        .modal-section h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .modal-section p {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .modal-tag {
            padding: 0.4rem 0.8rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .modal-wechat {
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-wechat:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
        }

        .modal-wechat .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .modal-wechat .value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.5rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* === FOOTER === */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent-purple);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* === ANIMATIONS === */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .member-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .member-card:nth-child(1) { animation-delay: 0.05s; }
        .member-card:nth-child(2) { animation-delay: 0.1s; }
        .member-card:nth-child(3) { animation-delay: 0.15s; }
        .member-card:nth-child(4) { animation-delay: 0.2s; }
        .member-card:nth-child(5) { animation-delay: 0.25s; }
        .member-card:nth-child(6) { animation-delay: 0.3s; }
        .member-card:nth-child(7) { animation-delay: 0.35s; }
        .member-card:nth-child(8) { animation-delay: 0.4s; }
        .member-card:nth-child(9) { animation-delay: 0.45s; }
        .member-card:nth-child(10) { animation-delay: 0.5s; }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .search-row {
                flex-direction: column;
            }

            .search-input {
                min-width: 100%;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .modal-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>AI×个人品牌收钱营</h1>
            <p>成员目录 · 快速找到你想链接的伙伴</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <span id="total-members">48</span>
                    已登记成员
                </div>
                <div class="stat-item">
                    <span>156</span>
                    群总人数
                </div>
                <div class="stat-item">
                    <span>2026.5.29-6.4</span>
                    实战营时间
                </div>
            </div>
        </div>
    </header>

    <!-- Search & Filter -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索昵称、姓名、学校、城市...">
            </div>
            <div class="filter-tags" id="filterTags">
                <button class="filter-tag active" data-filter="all">全部</button>
                <button class="filter-tag" data-filter="大一">大一</button>
                <button class="filter-tag" data-filter="大二">大二</button>
                <button class="filter-tag" data-filter="大三大四">大三/大四</button>
                <button class="filter-tag" data-filter="毕业生">毕业生/职场人</button>
                <button class="filter-tag" data-filter="AI">AI</button>
                <button class="filter-tag" data-filter="私域">私域</button>
                <button class="filter-tag" data-filter="变现">变现</button>
                <button class="filter-tag" data-filter="小红书">小红书</button>
                <button class="filter-tag" data-filter="校园经济">校园经济</button>
            </div>
        </div>
    </section>

    <!-- Members Grid -->
    <section class="members-section">
        <div class="members-count" id="membersCount">显示 48 位成员</div>
        <div class="members-grid" id="membersGrid">
            <!-- Dynamic content -->
        </div>
    </section>

    <!-- Member Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="memberModal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar"></div>
                <div class="modal-info">
                    <h2 id="modalName"></h2>
                    <div class="meta" id="modalMeta"></div>
                </div>
            </div>
            <div class="modal-section">
                <h4>正在做什么</h4>
                <p id="modalDoing"></p>
            </div>
            <div class="modal-section">
                <h4>想通过AI+个人品牌解决什么问题</h4>
                <p id="modalGoal"></p>
            </div>
            <div class="modal-section">
                <h4>标签</h4>
                <div class="modal-tags" id="modalTags"></div>
            </div>
            <div class="modal-section">
                <h4>添加微信</h4>
                <div class="modal-wechat" id="modalWechat" onclick="copyWechat()">
                    <div>
                        <div class="label">微信号 / 昵称</div>
                        <div class="value" id="modalWechatId"></div>
                    </div>
                    <div>📋 复制</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>AI×个人品牌收钱营 · 成员目录 · 2026</p>
        <p>Made with ❤️ for better connections</p>
    </footer>

    <script>
        // === DATA ===
        let members = [];
        let currentFilter = 'all';
        let currentSearch = '';

        // Load data
        async function loadMembers() {
            try {
                const response = await fetch('members.json');
                const data = await response.json();
                members = data.members;
                renderMembers();
            } catch (error) {
                console.error('Error loading members:', error);
            }
        }

        // Render members
        function renderMembers() {
            const grid = document.getElementById('membersGrid');
            const countEl = document.getElementById('membersCount');

            const filtered = members.filter(member => {
                // Search filter
                const searchMatch = currentSearch === '' ||
                    member.nickname.toLowerCase().includes(currentSearch) ||
                    member.name.toLowerCase().includes(currentSearch) ||
                    member.school.toLowerCase().includes(currentSearch) ||
                    member.city.toLowerCase().includes(currentSearch) ||
                    member.doing.toLowerCase().includes(currentSearch) ||
                    member.goal.toLowerCase().includes(currentSearch) ||
                    member.tags.some(tag => tag.toLowerCase().includes(currentSearch));

                // Category filter
                let filterMatch = true;
                if (currentFilter !== 'all') {
                    if (currentFilter === '大三大四') {
                        filterMatch = member.grade === '大三' || member.grade === '大四';
                    } else if (currentFilter === '毕业生') {
                        filterMatch = member.grade === '毕业生' || member.grade === '社会人' || member.identity === '职场人';
                    } else {
                        filterMatch = member.tags.some(tag => tag.includes(currentFilter)) ||
                            member.grade.includes(currentFilter) ||
                            member.doing.includes(currentFilter) ||
                            member.goal.includes(currentFilter);
                    }
                }

                return searchMatch && filterMatch;
            });

            countEl.textContent = `显示 ${filtered.length} 位成员`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <p>没有找到匹配的成员</p>
                        <p>试试其他关键词或筛选条件</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((member, index) => `
                <div class="member-card ${member.is_admin ? 'admin' : ''}"
                     onclick="openModal(${member.id})"
                     style="animation-delay: ${index * 0.05}s">
                    ${member.is_admin ? '<span class="admin-badge">运营</span>' : ''}
                    <div class="card-header">
                        <div class="avatar">${member.nickname.charAt(0)}</div>
                        <div class="card-info">
                            <h3>${member.nickname}</h3>
                            <div class="subtitle">${member.name}${member.school ? ' · ' + member.school : ''}</div>
                        </div>
                    </div>
                    <div class="card-doing">${member.doing}</div>
                    <div class="card-tags">
                        <span class="tag city">${member.city}</span>
                        ${member.grade ? `<span class="tag grade">${member.grade}</span>` : ''}
                        ${member.tags.slice(0, 2).map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Open modal
        function openModal(id) {
            const member = members.find(m => m.id === id);
            if (!member) return;

            const modal = document.getElementById('memberModal');
            const overlay = document.getElementById('modalOverlay');

            document.getElementById('modalAvatar').textContent = member.nickname.charAt(0);
            document.getElementById('modalName').textContent = member.nickname;
            document.getElementById('modalMeta').textContent =
                `${member.name} · ${member.city}${member.school ? ' · ' + member.school : ''}${member.grade ? ' · ' + member.grade : ''}`;
            document.getElementById('modalDoing').textContent = member.doing;
            document.getElementById('modalGoal').textContent = member.goal;
            document.getElementById('modalWechatId').textContent = member.wechat;

            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = member.tags.map(tag => `<span class="modal-tag">${tag}</span>`).join('');

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Copy wechat
        function copyWechat() {
            const wechatId = document.getElementById('modalWechatId').textContent;
            navigator.clipboard.writeText(wechatId).then(() => {
                alert('已复制到剪贴板：' + wechatId);
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = wechatId;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('已复制到剪贴板：' + wechatId);
            });
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadMembers();

            // Search input
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearch = e.target.value.toLowerCase();
                renderMembers();
            });

            // Filter tags
            document.getElementById('filterTags').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderMembers();
                }
            });

            // Modal close
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    closeModal();
                }
            });

            // Keyboard close
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
